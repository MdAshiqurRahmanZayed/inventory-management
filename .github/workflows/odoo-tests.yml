name: Odoo tests

on:
  workflow_dispatch:

jobs:
  odoo-tests:
    name: Odoo module tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Odoo config
        run: cp odoo.conf.example odoo.conf

      - name: Pre-pull base images via mirror (avoids Docker Hub's anonymous pull rate limit)
        run: |
          docker pull mirror.gcr.io/library/postgres:16
          docker tag mirror.gcr.io/library/postgres:16 postgres:16
          docker pull mirror.gcr.io/library/odoo:19.0
          docker tag mirror.gcr.io/library/odoo:19.0 odoo:19.0

      - name: Start Postgres
        run: docker compose up -d db

      - name: Wait for Postgres to be healthy
        run: |
          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' inventory-management-db-1 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              echo "Postgres is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become healthy in time"
          docker compose logs db
          exit 1

      - name: Run inventory_management and im_mcp tests
        run: |
          docker compose run --rm odoo odoo \
            -d ci_test \
            -i role_management,inventory_management,im_mcp \
            --test-enable \
            --test-tags /inventory_management,/im_mcp \
            --stop-after-init \
            --http-port=8169

      - name: Show logs on failure
        if: failure()
        run: docker compose logs
